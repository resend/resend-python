name: Release
on:
  push:
    tags:
      - 'v*'
concurrency:
  group: release
  cancel-in-progress: false
permissions: {}
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      stable: ${{ steps.meta.outputs.stable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Resolve release metadata
        id: meta
        run: |
          VERSION="$(python -c 'import re; print(re.search(r"__version__ = \"([^\"]+)\"", open("resend/version.py").read()).group(1))')"
          if ! python -c 'import re, sys; sys.exit(0 if re.fullmatch(r"\d+\.\d+\.\d+((a|b|rc)\d+)?", sys.argv[1]) else 1)' "$VERSION"; then
            echo "::error::resend/version.py version $VERSION is not a release version (X.Y.Z with an optional aN, bN or rcN suffix)"
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match resend/version.py version $VERSION"
            exit 1
          fi
          case "$VERSION" in
            *a*|*b*|*rc*) STABLE=false ;;
            *) STABLE=true ;;
          esac
          {
            echo "version=$VERSION"
            echo "stable=$STABLE"
          } >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: pip install tox build
      - name: Lint
        run: tox -e lint
      - name: Typecheck
        run: tox -e mypy
      - name: Test
        run: tox -e py
      - name: Build
        run: |
          rm -rf dist
          python -m build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
  publish-pypi:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
  release:
    needs: [ci, publish-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          prerelease: ${{ needs.ci.outputs.stable != 'true' }}
          make_latest: ${{ needs.ci.outputs.stable == 'true' }}
          generate_release_notes: true
